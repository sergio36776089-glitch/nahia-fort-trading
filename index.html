<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nahia❤️Fort Trading Simulator</title>

<script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  height: 65px;
  background: #101010;
  border-bottom: 1px solid #292929;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
}

.logo {
  font-size: 21px;
  font-weight: bold;
}

.logo span {
  color: #ed638e;
}

.status {
  color: #24c88b;
  font-size: 12px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  background: #111;
  border-bottom: 1px solid #292929;
}

select, button, input {
  background: #191919;
  border: 1px solid #353535;
  color: white;
  padding: 9px 12px;
  border-radius: 4px;
}

button {
  cursor: pointer;
}

button:hover {
  background: #303030;
}

.market {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 14px;
  flex-wrap: wrap;
  background: #0d0d0d;
}

.price {
  color: #26c995;
  font-size: 19px;
  font-weight: bold;
}

.charts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 8px;
}

.panel {
  background: #090909;
  border: 1px solid #292929;
  min-width: 0;
}

.panel-title {
  padding: 12px;
  background: #111;
  border-bottom: 1px solid #292929;
  font-size: 13px;
}

.chart {
  width: 100%;
  height: 440px;
}

.controls {
  margin: 8px;
  padding: 15px;
  background: #111;
  border: 1px solid #292929;
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin: 12px 0;
}

.call {
  background: #087c53;
  flex: 1;
}

.put {
  background: #a82d3d;
  flex: 1;
}

#history {
  font-size: 13px;
  line-height: 2;
}

@media(max-width:800px) {

  .charts {
    grid-template-columns: 1fr;
  }

  .chart {
    height: 350px;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">
    Nahia<span>❤️</span>Fort
  </div>

  <div class="status" id="status">
    ● SIMULACIÓN ACTIVA
  </div>

  <div>
    SALDO: $<span id="balance">10000</span>
  </div>

</header>

<div class="market">

  <select id="asset">
    <option>EUR/USD OTC</option>
    <option>EUR/USD</option>
    <option>GBP/USD</option>
    <option>GBP/USD OTC</option>
    <option>USD/JPY</option>
    <option>AUD/USD</option>
  </select>

  <select id="timeframe">
    <option value="1">M1</option>
    <option value="5">M5</option>
    <option value="15">M15</option>
  </select>

  <span class="price" id="price">
    1.08450
  </span>

</div>

<div class="toolbar">

  <button onclick="resetView()">
    Restablecer zoom
  </button>

  <button onclick="horizontalLine()">
    Línea horizontal
  </button>

  <button onclick="clearLines()">
    Borrar líneas
  </button>

  <button onclick="togglePlay()">
    Reproducir / Pausar
  </button>

  <button onclick="nextTick()">
    Avanzar
  </button>

</div>

<div class="charts">

  <div class="panel">

    <div class="panel-title">
      GRÁFICO DE VELAS JAPONESAS
    </div>

    <div id="candleChart" class="chart"></div>

  </div>

  <div class="panel">

    <div class="panel-title">
      GRÁFICO DE LÍNEAS
    </div>

    <div id="lineChart" class="chart"></div>

  </div>

</div>

<div class="controls">

  <h3>REPRODUCCIÓN HISTÓRICA SIMULADA</h3>

  <div class="row">

    <label>
      Fecha:
      <input type="date" id="date">
    </label>

    <label>
      Hora:
      <input type="time" id="hour" value="12:00">
    </label>

    <button onclick="loadScenario()">
      Cargar escenario
    </button>

  </div>

  <div class="row">

    <button onclick="togglePlay()" id="playButton">
      ⏸ Pausar
    </button>

    <button onclick="nextTick()">
      ⏭ Avanzar tick
    </button>

    <select id="speed">
      <option value="1000">1x</option>
      <option value="500">2x</option>
      <option value="200">5x</option>
      <option value="100">10x</option>
    </select>

  </div>

  <div class="row">

    <label>
      Importe:
      <input type="number" id="amount" value="100">
    </label>

    <button class="call" onclick="operation('CALL')">
      ▲ CALL
    </button>

    <button class="put" onclick="operation('PUT')">
      ▼ PUT
    </button>

  </div>

  <p id="message">
    Simulador preparado.
  </p>

</div>

<div class="controls">

  <h3>HISTORIAL</h3>

  <div id="history">
    Sin operaciones.
  </div>

</div>

<script>

// CONFIGURACIÓN DE GRÁFICOS

const chartOptions = {

  layout: {
    background: {
      color: '#090909'
    },

    textColor: '#999'
  },

  grid: {
    vertLines: {
      color: '#202020'
    },

    horzLines: {
      color: '#202020'
    }
  },

  rightPriceScale: {
    borderColor: '#333'
  },

  timeScale: {
    borderColor: '#333',
    timeVisible: true,
    secondsVisible: false
  },

  crosshair: {
    mode: 0
  }

};

const candleChart =
  LightweightCharts.createChart(
    document.getElementById('candleChart'),
    chartOptions
  );

const lineChart =
  LightweightCharts.createChart(
    document.getElementById('lineChart'),
    chartOptions
  );

const candleSeries =
  candleChart.addCandlestickSeries({

    upColor: '#19bd83',
    downColor: '#ed5262',

    borderUpColor: '#19bd83',
    borderDownColor: '#ed5262',

    wickUpColor: '#19bd83',
    wickDownColor: '#ed5262'

  });

const lineSeries =
  lineChart.addLineSeries({

    color: '#32a9ed',
    lineWidth: 2,

    crosshairMarkerVisible: true

  });
